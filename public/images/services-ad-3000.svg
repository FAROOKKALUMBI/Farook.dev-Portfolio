    <text x="330" y="2560" font-size="56" font-weight="700" fill="#FFFFFF" font-family="Poppins, Segoe UI, sans-serif">CONTACT US</text>
    <text x="330" y="2640" font-size="44" fill="#FFFFFF" font-family="Poppins, Segoe UI, sans-serif">+265 99 999 9999</text>
    <text x="330" y="2700" font-size="40" fill="#FFFFFF" opacity="0.75" font-family="Poppins, Segoe UI, sans-serif">hello@yourshop.com</text>
