    <text x="260" y="640" font-size="92" font-weight="600">Laptops, Phones and</text>
    <text x="260" y="740" font-size="92" font-weight="600">Accessories</text>
  </g>

  <g font-family="Poppins, Segoe UI, sans-serif">
