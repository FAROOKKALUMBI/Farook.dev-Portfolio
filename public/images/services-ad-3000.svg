    <text x="1220" y="900" font-size="140" font-weight="800" fill="none" stroke="#1B0A2B" stroke-width="4" opacity="0.4">Shop Now!</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="220" y="980" width="820" height="880" rx="48" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <rect x="1080" y="980" width="820" height="880" rx="48" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <rect x="1940" y="980" width="820" height="880" rx="48" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.35"/>
