  <g>
    <ellipse cx="2100" cy="2100" rx="200" ry="260" fill="#F1C9A5"/>
    <rect x="2000" y="1950" width="320" height="360" rx="60" fill="#F7E4D0"/>
    <rect x="2060" y="2100" width="260" height="120" rx="40" fill="#D7A887"/>
    <rect x="2280" y="2050" width="200" height="320" rx="30" fill="#A79BFF"/>
    <rect x="1960" y="2250" width="500" height="140" rx="30" fill="#2C2C38"/>
  </g>

  <g>
    <rect x="2320" y="2250" width="360" height="520" rx="40" fill="#5C657A"/>
    <rect x="2340" y="2270" width="320" height="480" rx="32" fill="#7B859C"/>
